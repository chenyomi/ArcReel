# 加到现有 nginx。个人主页 chenyomi.top 的 server 不要动。
# 证书：sudo certbot certonly --webroot -w /var/www/html -d api.chenyomi.top -d admin.chenyomi.top

server {
    listen 80;
    server_name api.chenyomi.top admin.chenyomi.top;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    server_name api.chenyomi.top;
    ssl_certificate     /etc/letsencrypt/live/api.chenyomi.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.chenyomi.top/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 12m;

    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header Host $host;
    }
}

server {
    listen 443 ssl;
    server_name admin.chenyomi.top;
    ssl_certificate     /etc/letsencrypt/live/api.chenyomi.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.chenyomi.top/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    location / {
        proxy_pass http://127.0.0.1:8787/admin/;
        proxy_set_header Host $host;
    }
}
